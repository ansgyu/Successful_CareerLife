<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직업탐구 수능특강 개념 마스터</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-gray: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --correct: #16a34a;
      --incorrect: #dc2626;
      --correct-bg: #dcfce7;
      --incorrect-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: var(--text-dark);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px 0;
    }

    header h1 {
      font-size: 1.8rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .selector-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .subject-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background-color: #eff6ff;
    }

    .lecture-select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lecture-select-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-dark);
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .content-area {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .content-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .content-header h2 {
      font-size: 1.4rem;
      color: #0f172a;
    }

    .concept-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .concept-table th, .concept-table td {
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      font-size: 0.95rem;
    }

    .concept-table th {
      background-color: #f1f5f9;
      color: #334155;
      width: 25%;
      font-weight: 600;
      text-align: center;
    }

    .concept-table td {
      text-align: left;
    }

    .blank-input {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.95rem;
      text-align: center;
      width: 100px;
      margin: 0 4px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .blank-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .blank-input.correct {
      border-color: var(--correct) !important;
      background-color: var(--correct-bg) !important;
      color: var(--correct) !important;
    }

    .blank-input.incorrect {
      border-color: var(--incorrect) !important;
      background-color: var(--incorrect-bg) !important;
      color: var(--incorrect) !important;
    }

    .correct-answer-hint {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--incorrect);
      font-weight: 600;
      margin-left: 4px;
    }

    .action-group {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: var(--text-dark);
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .result-score {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .placeholder-view {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
    }

    .placeholder-view h3 {
      font-size: 1.2rem;
      color: #334155;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>수능특강 직업탐구 개념 마스터</h1>
      <p>과목과 강을 선택하고 핵심 요약 표의 빈칸을 채우며 개념을 점검해보세요.</p>
    </header>

    <section class="selector-card">
      <div class="subject-tabs">
        <button class="tab-btn active" data-subject="success">성공적인 직업생활</button>
        <button class="tab-btn" data-subject="industry">공업 일반</button>
      </div>

      <div class="lecture-select-group">
        <label for="lectureSelect">학습할 강의 선택</label>
        <div style="display: flex; gap: 10px;">
          <select id="lectureSelect" style="flex: 1;"></select>
          <button id="startBtn" class="btn btn-primary" style="white-space: nowrap;">학습 시작하기</button>
        </div>
      </div>
    </section>

    <main class="content-area" id="learningArea"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
